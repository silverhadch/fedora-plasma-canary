---
name: Build container image

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**/README.md'
  workflow_run:
    workflows:
      - "Build KDE Master"
    types:
      - completed
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check_kde_build:
    name: Check KDE nightly RPMs exist
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    permissions:
      contents: read
      actions: read
    outputs:
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - name: Check for kde-nightly release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pull requests build against the RPMs of the branch they target.
          RELEASE_TAG="kde-nightly-${{ github.base_ref || github.ref_name }}"

          if ! ASSETS=$(gh release view "${RELEASE_TAG}" --repo ${{ github.repository }} \
                --json assets --jq '.assets[].name' 2>/dev/null); then
            echo "::error::${RELEASE_TAG} release not found. Please run the 'Build KDE Master' workflow first."
            exit 1
          fi

          if ! grep -qx 'manifest.txt' <<<"${ASSETS}"; then
            echo "::error::${RELEASE_TAG} has no manifest.txt, so it predates the RPM pipeline. Rerun 'Build KDE Master'."
            exit 1
          fi

          PUBLISHED=$(gh release view "${RELEASE_TAG}" --repo ${{ github.repository }} \
                      --json publishedAt --jq '.publishedAt')
          AGE_DAYS=$(( ( $(date +%s) - $(date -d "${PUBLISHED}" +%s) ) / 86400 ))
          if [ "${AGE_DAYS}" -ge 2 ]; then
            echo "::warning::The KDE RPMs are ${AGE_DAYS} days old: 'Build KDE Master' has not published since ${PUBLISHED}."
          fi

          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "${RELEASE_TAG} release and RPMs found, proceeding with image build."

  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04
    needs: check_kde_build
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: dx
            suffix: ""

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: mathio/gha-cleanup@v1
        with:
          remove-browsers: true
          verbose: true

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io \
            -u ${{ github.actor }} --password-stdin

      - name: Mount BTRFS for podman storage
        id: container-storage-action
        uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6
        continue-on-error: true
        with:
          target-dir: /var/lib/containers
          mount-opts: compress-force=zstd:2
          loopback-free: '1'

      - name: Download KDE master RPMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.check_kde_build.outputs.release_tag }}
        run: |
          set -euo pipefail
          RPM_DIR=build_files/rpms
          mkdir -p "${RPM_DIR}"

          gh release download ${RELEASE_TAG} \
            --repo ${{ github.repository }} \
            --pattern 'manifest.txt' \
            --pattern 'kde-canary*.rpm' \
            --dir "${RPM_DIR}"

          # build.sh installs exactly what the manifest lists
          while read -r rpm; do
            if [ ! -f "${RPM_DIR}/${rpm}" ]; then
              echo "::error::${rpm} is listed in manifest.txt but missing from ${RELEASE_TAG}."
              exit 1
            fi
          done < "${RPM_DIR}/manifest.txt"
          echo "Fetched $(wc -l < "${RPM_DIR}/manifest.txt") packages, $(du -sh "${RPM_DIR}" | cut -f1)."

          if gh release download ${RELEASE_TAG} \
            --repo ${{ github.repository }} \
            --pattern 'base-image-digest.txt' \
            --output /tmp/base-image-digest.txt 2>/dev/null; then
            PINNED=$(grep '^rawhide=' /tmp/base-image-digest.txt | cut -d= -f2)
            echo "Using pinned base image: ${PINNED}"
            echo "PINNED_BASE_IMAGE=${PINNED}" >> ${GITHUB_ENV}
          else
            # Never fall back to quay.io directly: its tags expire and the
            # mirror is the whole reason this pipeline survives that.
            MIRROR="ghcr.io/${{ github.repository_owner }}/fedora-plasma-canary-kinoite"
            echo "::warning::base-image-digest.txt not found in ${RELEASE_TAG} release. Falling back to the mirror's :latest."
            echo "PINNED_BASE_IMAGE=${MIRROR,,}:latest" >> ${GITHUB_ENV}
          fi

      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "BASE_IMAGE=${PINNED_BASE_IMAGE}" >> ${GITHUB_ENV}

          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "IMAGE_NAME=${{ github.event.repository.name }}-dev" >> ${GITHUB_ENV}
            echo "DEFAULT_TAG=dev" >> ${GITHUB_ENV}
          else
            echo "IMAGE_NAME=${{ github.event.repository.name }}" >> ${GITHUB_ENV}
            echo "DEFAULT_TAG=latest" >> ${GITHUB_ENV}
          fi

      - name: Build Image
        id: build-image
        run: |
          sudo -E $(command -v just) build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          sudo -E $(command -v just) ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(sudo -E $(command -v just) generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"
          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          sudo -E $(command -v just) tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail

          for tag in ${ALIAS_TAGS}; do
            sudo podman push ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(sudo skopeo inspect docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG} --format '{{.Digest}}')
          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        with:
          cosign-release: 'v2.6.1'

      - name: Sign container image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_REGISTRY_USERNAME: ${{ github.actor }}
          COSIGN_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}
