name: Build KDE Master

on:
  schedule:
    - cron: '00 02 * * *'
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: kde-build-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # Kinoite rawhide, mirrored daily. Also the default BASE_IMAGE in the
  # Containerfile and the Justfile, keep in sync.
  MIRROR_NAME: fedora-plasma-canary-kinoite

jobs:
  build_kde:
    name: Build KDE from source
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: read
      packages: write
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> ${GITHUB_ENV}

      - uses: mathio/gha-cleanup@v1
        with:
          remove-browsers: true
          verbose: true

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/ccache
          key: ccache-kde-build-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-kde-build-${{ github.ref_name }}-
            ccache-kde-build-

      - name: Inject ccache into build
        run: |
          mkdir -p /home/runner/ccache
          chmod 777 /home/runner/ccache

      - name: Mirror Kinoite rawhide
        run: |
          set -euo pipefail
          mkdir -p /tmp/kde-work
          DATE=$(date +%Y%m%d)
          MIRROR="ghcr.io/${{ github.repository_owner }}/${MIRROR_NAME}"
          MIRROR="${MIRROR,,}"

          if ! echo "${{ secrets.GITHUB_TOKEN }}" | sudo skopeo login ghcr.io \
                -u ${{ github.actor }} --password-stdin; then
            echo "::error::Failed to log in to ghcr.io."
            exit 1
          fi

          # Kinoite rawhide is published in more than one place and any of them
          # can go stale or lose its tag on a given day. The resolver inspects
          # all of them plus the mirror's own :latest and returns whichever was
          # built most recently, so the mirror only ever moves forward and a bad
          # upstream day just reuses it.
          SRC=$(sudo python3 .github/scripts/resolve-base.py --mirror "${MIRROR}:latest")

          if [ "${SRC}" = "${MIRROR}:latest" ]; then
            echo "The mirror already holds the newest Kinoite rawhide."
            PIN="${MIRROR}:latest"
          else
            # Single-arch copy: only amd64 is built, and Kinoite is big enough
            # that copying every architecture daily eats into the build budget.
            sudo skopeo copy --retry-times 3 \
              "docker://${SRC}" "docker://${MIRROR}:rawhide-${DATE}"
            sudo skopeo copy \
              "docker://${MIRROR}:rawhide-${DATE}" "docker://${MIRROR}:latest"
            echo "Mirrored ${SRC} -> ${MIRROR}:rawhide-${DATE}"
            PIN="${MIRROR}:rawhide-${DATE}"
          fi

          DIGEST=$(sudo skopeo inspect --no-tags --format '{{.Digest}}' "docker://${PIN}")
          echo "BASE_IMAGE=${MIRROR}@${DIGEST}" >> ${GITHUB_ENV}
          printf 'rawhide=%s@%s\nsource=%s\n' "${MIRROR}" "${DIGEST}" "${SRC}" \
            > /tmp/kde-work/base-image-digest.txt
          echo "Pinned: $(head -1 /tmp/kde-work/base-image-digest.txt)"

      - name: Build and package KDE in container
        id: kde_build
        run: |
          set -uo pipefail
          mkdir -p /tmp/kde-work

          # 5h45m of build time, but never past 5h47m of total job wall clock,
          # so the ccache save always has room to run before GitHub's 6h kill.
          BUILD_BUDGET=$(( 345 * 60 ))
          JOB_CEILING=$(( 347 * 60 ))
          ELAPSED=$(( $(date +%s) - JOB_START ))
          REMAINING=$(( JOB_CEILING - ELAPSED ))
          LIMIT=$(( BUILD_BUDGET < REMAINING ? BUILD_BUDGET : REMAINING ))

          if [ "${LIMIT}" -le 0 ]; then
            echo "::error::Setup consumed the entire job budget, no time left to build."
            exit 1
          fi

          echo "Setup took $(( ELAPSED / 60 ))m. Build limit: $(( LIMIT / 60 ))m."

          # timeout runs *under* sudo so it supervises podman directly and the
          # TERM actually reaches the container. Everything ccache has written
          # to the bind mount up to that instant survives. Inside, kde-builder
          # is stopped PACKAGE_RESERVE seconds before BUILD_DEADLINE so that
          # turning the tree into RPMs always fits inside the same limit.
          sudo timeout --signal=TERM --kill-after=120 "${LIMIT}s" \
            podman run --rm \
              --privileged \
              --env BUILD_DEADLINE="$(( $(date +%s) + LIMIT ))" \
              --env PACKAGE_RESERVE=1800 \
              --volume "$(pwd)/build_files:/ctx:ro" \
              --volume "/home/runner/ccache:/ccache" \
              --volume "/tmp/kde-work:/work" \
              "${BASE_IMAGE}" \
              bash /ctx/kde-build-container.sh
          rc=$?

          if [ "${rc}" -eq 124 ] || [ "${rc}" -eq 137 ]; then
            echo "::warning::Build hit the $(( LIMIT / 60 ))m limit and was stopped. \
          The warm ccache is still being saved — rerun to continue from it."
          fi

          exit "${rc}"

      - name: Normalise ccache ownership
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" /home/runner/ccache || true
          du -sh /home/runner/ccache || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: /home/runner/ccache
          key: ccache-kde-build-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kde-build-logs-${{ github.ref_name }}
          path: /tmp/kde-work/logs/
          retention-days: 7

      - name: Stage build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kde-build-${{ github.ref_name }}
          path: |
            /tmp/kde-work/rpms/
            /tmp/kde-work/meta/
            /tmp/kde-work/base-image-digest.txt
          if-no-files-found: error
          retention-days: 1
          # RPM payloads are already zstd-compressed
          compression-level: 0

  release:
    name: Check and publish release
    runs-on: ubuntu-24.04
    needs: build_kde
    permissions:
      contents: write
      packages: read
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: kde-build-${{ github.ref_name }}
          path: /tmp/kde-work/

      - name: Check the image transaction installs
        run: |
          set -euo pipefail
          BASE=$(grep '^rawhide=' /tmp/kde-work/base-image-digest.txt | cut -d= -f2)
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io \
            -u ${{ github.actor }} --password-stdin

          # A fresh copy of the exact base the RPMs were built on, running the
          # exact transaction build.sh will run. If it cannot install, stop
          # here: the release keeps the last good RPMs and the image keeps
          # building from them.
          sudo podman run --rm \
            --volume "$(pwd)/build_files:/ctx:ro" \
            --volume "/tmp/kde-work/rpms:/rpms:ro" \
            "${BASE}" \
            bash /ctx/check-install.sh /rpms

      - name: Publish RPMs to kde-nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: kde-nightly-${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd /tmp/kde-work

          # Recreated rather than updated: the set of assets changes whenever a
          # project is added or dropped, and a leftover RPM from an older build
          # has no business sitting next to the new ones. One asset per RPM, so
          # no single file runs into the release asset size limit.
          gh release delete "${TAG}" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --latest=false \
            --title "KDE Master Nightly (${{ github.ref_name }})" \
            --notes "KDE git master built as RPMs for branch ${{ github.ref_name }}, updated daily. Consumed by the image build pipeline, install kde-canary from here only if you know why." \
            rpms/*.rpm rpms/manifest.txt meta/replaced.txt base-image-digest.txt
